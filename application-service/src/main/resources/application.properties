spring.application.name=application-service

server.port=8083

spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/talenthire_application_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

file.upload-path=resumeUploads

spring.datasource.username=root
spring.datasource.password=neema
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer



groq.api.key=${GROQ_API_KEY}













