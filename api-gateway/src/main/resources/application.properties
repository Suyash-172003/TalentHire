spring.application.name=api-gateway

server.port=8080

# Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# JWT
jwt.secret.key=${JWT_SECRET}
jwt.expiration.time=1800000

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:5173
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Auth Service
spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

# Job Service
spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=lb://job-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/job/**

# Application Service
spring.cloud.gateway.routes[2].id=application-service
spring.cloud.gateway.routes[2].uri=lb://application-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/application/**

# Assessment Service
spring.cloud.gateway.routes[3].id=assessment-service
spring.cloud.gateway.routes[3].uri=lb://assessment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/assessment/**

# Resume → Application Service
spring.cloud.gateway.routes[4].id=resume-service
spring.cloud.gateway.routes[4].uri=lb://application-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/resume/**